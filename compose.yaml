
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_data:
